[package]
name = "seedr-dl"
version = "0.1.0"
edition = "2021"
authors = ["Praveensenpai <pvnt20@gmail.com>"]
description = "Pure Rust Seedr.cc downloader with Gemini AI renaming for Jellyfin"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
regex = "1.11"
futures-util = "0.3"
crossterm = "0.28"
ratatui = "0.29"

[lints.rust]
unused = "deny"
dead_code = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_arguments = "deny"
unwrap_used = "deny"
expect_used = "deny"
