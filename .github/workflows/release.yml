name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "seedr-dl-release-${{ matrix.target }}"
          save-if: true

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (.tar.gz)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/seedr-dl staging/
          cd staging
          tar -czf ../seedr-dl-${{ matrix.target }}.tar.gz seedr-dl
          cd ..

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: seedr-dl-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ⚡ seedr-dl ${{ github.ref_name }}
          body: |
            ⚡ **seedr-dl ${{ github.ref_name }}** ✨
            High-performance Ratatui TUI for Seedr.cc featuring 8-thread parallel downloads, background worker daemon with attach/detach, and automated Jellyfin AI ingestion.

            ### 🌟 Key Highlights
            - ⚡ **Ratatui TUI Dashboard**: Real-time terminal interface with category tabs, active transfer monitors, speed meters, and keyboard shortcuts.
            - 🚀 **8-Thread Parallel Chunk Downloader**: HTTP Range multi-threaded engine saturating high-bandwidth connections.
            - 🔄 **Resumable Transfers**: Per-chunk progress persistence allowing seamless resumption if interrupted.
            - 🔌 **Attach / Detach Background Worker**: Spawn transfers as detached background tasks; monitor progress with `[a]`, detach with `[d]`.
            - 🤖 **Gemini AI Title Parser**: Cleanly normalizes chaotic torrent filenames into standard Movie / TV Show naming.
            - 🎬 **Jellyfin Media Ingestion**: Automatically moves and organizes completed media into your media library.
            - 📦 **Compact Compressed Archives**: Distributed as `.tar.gz` for minimal download size and instant installation.

            ### 🚀 One-Liner Install
            ```bash
            curl -LsSf https://raw.githubusercontent.com/Praveensenpai/seedr-dl/main/install.sh | bash
            ```

            ### 📦 Release Assets
            - **Linux (x86_64, musl static)**: `seedr-dl-x86_64-unknown-linux-musl.tar.gz`
            - **macOS (Apple Silicon M-series)**: `seedr-dl-aarch64-apple-darwin.tar.gz`
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
